<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINCE LOTO — Management Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ── TOP BAR ── -->
  <header class="top-bar">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Default brand (hidden for sub-admin) -->
    <a class="brand-name" id="brandBtn" href="#" aria-label="Go to dashboard">
      <i class="fas fa-crown"></i>
      PRINCE LOTO
    </a>

    <!-- Sub-admin company branding — replaces brand on left (hidden until logged in as subAdmin) -->
    <div id="topbarCompanyInfo" class="topbar-company" hidden>
      <div id="topbarLogoWrap" class="topbar-company-logo-wrap">
        <img id="topbarCompanyLogo" class="topbar-company-logo" src="" alt="Company Logo">
      </div>
      <div class="topbar-company-text">
        <div id="topbarCompanyName" class="topbar-company-name">—</div>

      </div>
    </div>

    <div class="topbar-right">
      <div class="topbar-user">
        <i class="fas fa-user-circle"></i>
        <span id="topbarUserName">User</span>
      </div>
      <button class="disconnect-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </header>

  <!-- ── APP WRAPPER ── -->
  <div class="app-wrapper">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="mainSidebar">
      <a class="sidebar-brand" id="sidebarBrandBtn" href="#" aria-label="Dashboard">
        <div class="sidebar-logo-icon">
          <i class="fas fa-ticket-alt"></i>
        </div>
        <div class="sidebar-logo-text">
          PRINCE LOTO
          <span>Management Portal</span>
        </div>
      </a>

      <ul class="nav-menu" role="navigation" aria-label="Main navigation">
        <li class="nav-item" data-page="dashboard">
          <a href="#"><i class="fas fa-chart-pie"></i> Dashboard</a>
        </li>

        <!-- Admin-only nav items -->
        <li class="nav-item nav-admin" data-page="subadmins" hidden>
          <a href="#"><i class="fas fa-building"></i> Sub-Admins</a>
        </li>
        <li class="nav-item nav-admin" data-page="gamecategories" hidden>
          <a href="#"><i class="fas fa-dice"></i> Game Types</a>
        </li>
        <li class="nav-item nav-admin" data-page="lotterycategories" hidden>
          <a href="#"><i class="fas fa-calendar-alt"></i> Lottery Schedules</a>
        </li>

        <!-- Sub-admin / manager nav items -->
        <li class="nav-item nav-subadmin" data-page="sellers" hidden>
          <a href="#"><i class="fas fa-users"></i> Sellers</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="supervisors" hidden>
          <a href="#"><i class="fas fa-user-tie"></i> Supervisors</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="reports" hidden>
          <a href="#"><i class="fas fa-chart-line"></i> Reports</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="payment" hidden>
          <a href="#"><i class="fas fa-dollar-sign"></i> Payment</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="soldtickets" hidden>
          <a href="#"><i class="fas fa-receipt"></i> Sold Tickets</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="limit" hidden>
          <a href="#"><i class="fas fa-sliders-h"></i> Limits</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="blocknumbers" hidden>
          <a href="#"><i class="fas fa-ban"></i> Block Numbers</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="statistics" hidden>
          <a href="#"><i class="fas fa-chart-bar"></i> Statistics</a>
        </li>

        <!-- Shared -->
        <li class="nav-item" data-page="numbers">
          <a href="#"><i class="fas fa-dice-d6"></i> Winning Numbers</a>
        </li>
        <li class="nav-item nav-subadmin" data-page="wintickets" hidden>
          <a href="#"><i class="fas fa-trophy"></i> Winning Tickets</a>
        </li>
      </ul>
    </aside>

    <!-- ── MAIN CONTENT ── -->
    <main class="main-content" id="mainContent">
      <!-- Pages are injected here by app.js -->
    </main>

  </div>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- Toast notification container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ── SCRIPTS ─────────────────────────────────────────────────────
       Load order matters: config → utils → data → api → auth → pages → app
  ──────────────────────────────────────────────────────────────────── -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <!-- Page modules -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/sellers.js"></script>
  <script src="js/pages/supervisors.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/payment.js"></script>
  <script src="js/pages/sold-tickets.js"></script>
  <script src="js/pages/win-tickets.js"></script>
  <script src="js/pages/numbers.js"></script>
  <script src="js/pages/limit.js"></script>
  <script src="js/pages/statistics.js"></script>
  <!-- Admin pages -->
  <script src="js/pages/game-categories.js"></script>
  <script src="js/pages/lottery-categories.js"></script>
  <script src="js/pages/sub-admins.js"></script>
  <!-- Sub-admin pages -->
  <script src="js/pages/block-numbers.js"></script>

  <!-- Router & shell (must be last) -->
  <script src="js/app.js"></script>

</body>
</html>
